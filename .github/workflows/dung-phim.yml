name: Dựng phim

on:
  workflow_dispatch:
    inputs:
      kich_ban:
        description: "Tên file kịch bản trong thư mục phan_mem"
        default: "kich_ban_tap1.txt"

permissions:
  contents: write

concurrency:
  group: ghi-vao-kho

jobs:
  dung:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: for i in 1 2 3; do sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core && break; echo 'thử lại...'; sleep 20; done; which ffmpeg
      - run: for i in 1 2 3; do pip install vieneu pillow numpy scipy && break; sleep 20; done
      - name: Dựng phim (giọng VieNeu + hình)
        run: python phan_mem/lam_phim.py "phan_mem/${{ inputs.kich_ban }}"
      - name: Lưu phim vào thư mục phim/
        run: |
          ten=$(basename "${{ inputs.kich_ban }}" .txt)
          mv "phan_mem/${ten}.mp4" "phim/${ten}.mp4"
          git config user.name "kho-hinh-bot"
          git config user.email "kho-hinh-bot@users.noreply.github.com"
          git add phim
          git diff --cached --quiet || (git commit -m "Dựng phim ${ten}" && git pull --rebase -q && git push)
      - uses: actions/upload-artifact@v4
        with:
          name: phim
          path: phim/*.mp4
