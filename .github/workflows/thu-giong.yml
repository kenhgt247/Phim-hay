name: Thử giọng

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ghi-vao-kho

jobs:
  thu:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: for i in 1 2 3; do sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && break; echo 'thử lại...'; sleep 20; done; which ffmpeg
      - run: for i in 1 2 3; do pip install vieneu && break; sleep 20; done
      - name: Đọc thử tất cả giọng mẫu
        run: python cong_cu/thu_giong.py
      - name: Lưu vào kho
        run: |
          git config user.name "kho-hinh-bot"
          git config user.email "kho-hinh-bot@users.noreply.github.com"
          git add giong_mau
          git diff --cached --quiet || (git commit -m "Giọng mẫu VieNeu" && git pull --rebase -q && git push)
